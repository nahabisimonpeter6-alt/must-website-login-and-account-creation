<!DOCTYPE html>
<html lang="en">
<head>
  <!-- The viewport setting makes the layout fit phones as well as desktops. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="An unofficial HTML and CSS recreation of the MUST application portal.">
  <title>Create Account | MUST Application Portal Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="registration-page">
  <a class="skip-link" href="#main-content">Skip to account creation</a>
  <!-- SVG symbols draw the icons locally, without an icon font or JavaScript. -->
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="icon-user" viewBox="0 0 24 24"><circle cx="12" cy="6" r="5"/><path d="M3 22v-4a9 9 0 0 1 18 0v4Z"/></symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24"><circle cx="8" cy="6" r="4"/><path d="M0 21v-3a8 8 0 0 1 16 0v3Zm19-15h2v4h4v2h-4v4h-2v-4h-4v-2h4Z"/></symbol>
      <symbol id="icon-phone" viewBox="0 0 24 24"><path d="m6 2 5 2-2 6-3-1c1 5 4 8 9 9l-1-3 6-2 2 5c0 3-3 5-6 4C8 21 3 16 2 8 1 5 3 2 6 2Z"/></symbol>
      <symbol id="icon-mail" viewBox="0 0 24 24"><path d="M3 5h18v14H3z"/><path d="m3 6 9 7 9-7" fill="none" stroke="white" stroke-width="1.4"/></symbol>
      <symbol id="icon-arrow" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="m12 6 6 6-6 6v-4H6v-4h6Z"/></symbol>
    </defs>
  </svg>

  <!-- This separate page looks like the reference modal without needing JavaScript.
       Both close links return to index.html; it is not a scripted modal dialog. -->
  <main class="registration-shell" id="main-content">
    <section class="registration-card" aria-labelledby="register-title">
      <header class="modal-header">
        <div>
          <h1 id="register-title">Create Account</h1>
          <p class="subtitle">Provide your details to receive a temporary password.</p>
        </div>
        <a class="close-icon" href="index.html" aria-label="Close account creation and return to sign in">&times;</a>
      </header>

      <!-- The reference portal sends a temporary password instead of asking for one.
           This recreation does not send messages or create real accounts. -->
      <form aria-labelledby="register-title" aria-describedby="demo-note">
        <div class="modal-body">
          <div class="field-group">
            <label for="surname">Surname</label>
            <div class="input-group">
              <span class="input-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-user"></use></svg></span>
              <input id="surname" type="text" placeholder="Surname" autocomplete="family-name" required>
            </div>
          </div>
          <div class="field-group">
            <label for="other-names">Other Names</label>
            <div class="input-group">
              <span class="input-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-user"></use></svg></span>
              <input id="other-names" type="text" placeholder="Other names" autocomplete="given-name" required>
            </div>
          </div>
          <div class="field-group">
            <label for="phone">Phone Number</label>
            <!-- Uganda is the only country in this demo. The native select keeps
                 the screenshot's dropdown appearance and keyboard accessibility. -->
            <div class="phone-row">
              <select id="country-code" aria-label="Country calling code" autocomplete="tel-country-code">
                <option value="+256">Uganda (+256)</option>
              </select>
              <div class="input-group">
                <span class="input-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-phone"></use></svg></span>
                <input id="phone" type="tel" placeholder="0770000000" autocomplete="tel-national" aria-describedby="phone-help" required>
              </div>
            </div>
            <p class="field-help" id="phone-help">Use an active phone number to receive notifications.</p>
          </div>
          <div class="field-group">
            <label for="email">Email Address</label>
            <div class="input-group">
              <span class="input-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-mail"></use></svg></span>
              <input id="email" type="email" placeholder="myemail@gmail.com" autocomplete="email" required>
            </div>
          </div>
          <button class="email-help" type="button" aria-describedby="demo-note" title="Email account creation is not available in this demo">
            <span>Don't have an Email? Click to create</span> <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-arrow"></use></svg>
          </button>
        </div>

        <!-- Buttons cannot submit. Close is a real local navigation link. -->
        <footer class="modal-footer">
          <a class="button outline-secondary" href="index.html">Close</a>
          <button class="button create-button" type="button" aria-describedby="demo-note"><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-plus"></use></svg> Create Account</button>
        </footer>
      </form>
    </section>
    <p class="demo-note" id="demo-note">Unofficial demo · No account or temporary password is created.<br>No details are sent or stored by these pages.</p>
  </main>
</body>
</html>
